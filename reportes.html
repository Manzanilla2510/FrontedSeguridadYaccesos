<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reportes</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <h1 class="logo">🏥 Hospital Control System</h1>

  <nav class="menu">
    <a href="index.html">Inicio</a>
    <a href="personas.html">Personas</a>
    <a href="reportes.html">Reportes</a>
    <a href="dispositivos.html">Dispositivos</a>
  </nav>
</header>

<div class="container">

  <h2>Reportes</h2>

  <!-- 🔥 FORMULARIO POST -->
  <div class="form">

    <input type="text" id="codigoIdentidad" placeholder="Código Identidad (IDE-7)">
    <input type="text" id="codigoReporte" placeholder="Código Reporte (REP-7)">

    <select id="tipo">
      <option value="Informe">Informe</option>
      <option value="Incidente">Incidente</option>
      <option value="Alerta">Alerta</option>
    </select>

    <input type="text" id="descripcion" placeholder="Descripción">

    <button onclick="guardarReporte()">Guardar</button>
  </div>

  <br>

  <!-- TABLA -->
  <table border="1" width="100%">
    <thead>
      <tr>
        <th>Código Identidad</th>
        <th>Código Reporte</th>
        <th>Tipo</th>
        <th>Descripción</th>
      </tr>
    </thead>

    <tbody id="tabla"></tbody>
  </table>

</div>

<script src="js/reportes.js" defer></script>

</body>
</html>
